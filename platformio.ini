[env:esp32s3dev]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Simulation flag: set to 1 to force fake detection responses
build_flags =
  -DBOOT_SIMULATE=0
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

# Library dependencies
lib_deps =
    ; Adafruit Graphics Library (required by all Adafruit displays)
    adafruit/Adafruit GFX Library @ ^1.11.9
    
    ; Adafruit EPD Library (E-Ink display driver)
    adafruit/Adafruit EPD @ ^4.5.1
    
    ; SPI File system library (SD card support)
    greiman/SdFat @ ^2.2.3
    
    ; OpenBook EPD - E-Ink display support for OpenBook
    https://github.com/joeycastillo/OpenBook_EPD.git
    
    ; BabelTypesetterGFX - Text rendering library
    https://github.com/joeycastillo/babel.git

# Build flags and board-specific settings
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DOPENBOOK_DISPLAY_WIDTH=300
    -DOPENBOOK_DISPLAY_HEIGHT=400
    -DOPENBOOK_DISPLAY_ROTATION=0

# Compiler settings
upload_speed = 460800
